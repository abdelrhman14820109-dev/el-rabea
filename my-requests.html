<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0879d5">
<title>مركز الربيع | طلباتي</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Tahoma,Arial,sans-serif;color:#fff}
body{min-height:100svh;background:radial-gradient(ellipse at 60% 22%,#55c6ff 0,transparent 38%),radial-gradient(ellipse at 0 85%,#0062c5 0,transparent 48%),linear-gradient(145deg,#08baff,#087ad8 43%,#0054b4 75%,#0a8ce6);overflow-x:hidden}
body:before{content:"";position:fixed;inset:-15%;z-index:-1;pointer-events:none;background:repeating-linear-gradient(155deg,transparent 0 100px,rgba(255,255,255,.12) 102px,transparent 108px 180px);transform:rotate(-5deg)}
body:after{content:"";position:fixed;top:0;left:-20%;width:140%;height:2px;background:#6ff5ff;box-shadow:0 0 15px 5px #2bdfff;transform:rotate(-27deg);pointer-events:none}
.page{width:min(100%,680px);margin:auto;padding:25px 20px 24px}
.header-title{display:flex;align-items:center;gap:15px;margin-bottom:22px}
.header-title h1{font-size:26px;margin:0;font-weight:900}
.back-btn{width:45px;height:45px;border-radius:50%;background:rgba(255,255,255,0.2);border:1px solid rgba(255,255,255,0.5);display:grid;place-items:center;color:#fff;text-decoration:none;font-size:24px;font-weight:bold;transition:background 0.3s}
.back-btn:hover{background:rgba(255,255,255,0.35)}

.glass-card{background:linear-gradient(135deg,rgba(135,219,255,.4),rgba(13,116,215,.4));border:1px solid rgba(255,255,255,.66);border-radius:26px;padding:20px;margin-bottom:16px;box-shadow:inset 0 1px 9px rgba(255,255,255,.32),0 12px 25px rgba(0,40,110,.16);backdrop-filter:blur(10px)}

.request-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;border-bottom:1px solid rgba(255,255,255,0.3);padding-bottom:12px}
.request-title{font-size:20px;font-weight:900}
.badge-payment{padding:6px 14px;border-radius:20px;font-size:13px;font-weight:bold;display:inline-block}
.paid{background:#10b981;color:#fff;box-shadow:0 0 12px rgba(16,185,129,0.5)}
.unpaid{background:#ef4444;color:#fff;box-shadow:0 0 12px rgba(239,68,68,0.5)}
.pending-pay{background:#f59e0b;color:#fff;box-shadow:0 0 12px rgba(245,158,11,0.5)}

.request-details{display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:14px}
.detail-item{background:rgba(255,255,255,0.18);padding:12px 14px;border-radius:16px;border:1px solid rgba(255,255,255,0.3)}
.detail-item label{display:block;font-size:12px;color:#c9f2ff;margin-bottom:4px;font-weight:bold}
.detail-item strong{font-size:15px;display:block;color:#fff}

.nav{position:sticky;bottom:10px;margin:27px -3px 0;border-radius:50px;min-height:88px;display:grid;grid-template-columns:repeat(4,1fr);align-items:center;padding:9px 5px;background:linear-gradient(120deg,rgba(159,224,255,.4),rgba(4,102,200,.46));border:1px solid rgba(255,255,255,.6);box-shadow:inset 0 1px 8px rgba(255,255,255,.35),0 8px 20px rgba(0,30,90,.2);backdrop-filter:blur(12px)}
.nav a{text-decoration:none;color:#bdeeff;font:13px Tahoma,Arial;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer}.nav .ni{font-size:29px;line-height:1}.nav a.active{color:#fff;font-weight:bold}

#splash{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden;transition:opacity .45s ease,visibility .45s ease}
#splash img{display:block;width:100%;height:100%;object-fit:contain;max-width:100vw;max-height:100svh}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none}
</style>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>
<div id="splash" aria-label="أنيميشن مركز الربيع"><img src="alrabea-animation.gif" alt="أنيميشن مركز الربيع"></div>

<main class="page">
<div class="header-title">
  <a href="index-home.html" class="back-btn">‹</a>
  <h1>طلباتي والجلسات</h1>
</div>

<div id="requestsContainer">
  <div class="glass-card" style="text-align:center; padding:30px;">
    <p style="font-size:16px; margin:0; color:#e0f4ff;">⏳ جاري جلب تفاصيل طلباتك من النظام...</p>
  </div>
</div>

<nav class="nav">
<a href="settings.html"><span class="ni">⚙</span>الإعدادات</a>
<a href="reports.html"><span class="ni">▤</span>التقارير</a>
<a href="my-requests.html" class="active"><span class="ni">📦</span>طلباتي</a>
<a href="index-home.html"><span class="ni">⌂</span>الرئيسية</a>
</nav>
</main>

<script>
window.addEventListener('load', function(){
  setTimeout(function(){
    var splash = document.getElementById('splash');
    if(splash) splash.classList.add('hide');
  }, 1500);
});

const firebaseConfig = {
  apiKey: "AIzaSyCTPQTbz6h9oVMo1N4Y_3r_RAi1RCXSEhM",
  authDomain: "el-rabea.firebaseapp.com",
  projectId: "el-rabea",
  storageBucket: "el-rabea.firebasestorage.app",
  messagingSenderId: "527658441562",
  appId: "1:527658441562:web:ef9d9bd5461d87eeb63163",
  measurementId: "G-2592BQ0ZS7"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

async function loadMyRequests() {
  const container = document.getElementById('requestsContainer');
  const localData = JSON.parse(localStorage.getItem('alrabeaPatient') || 'null');

  if (!localData || !localData.id) {
    container.innerHTML = `
      <div class="glass-card" style="text-align:center; padding:30px;">
        <p style="font-size:16px; margin:0; color:#ffdddd;">⚠️ لم يتم العثور على بيانات تسجيل الدخول. يرجى تسجيل الدخول مرة أخرى.</p>
      </div>
    `;
    return;
  }

  try {
    const docSnap = await db.collection("patients").doc(localData.id).get();
    if (docSnap.exists) {
      const data = docSnap.data();
      
      let paymentStatus = data.paymentStatus || "غير مدفوع";
      let badgeClass = "unpaid";
      let paymentText = "غير مدفوع ❌";

      if (paymentStatus === "مدفوع") {
        badgeClass = "paid";
        paymentText = "مدفوع ✅";
      } else if (paymentStatus === "قيد المراجعة") {
        badgeClass = "pending-pay";
        paymentText = "قيد المراجعة ⏳";
      }

      container.innerHTML = `
        <div class="glass-card">
          <div class="request-header">
            <span class="request-title">جلسة: ${data.type || 'علاج طبيعي'}</span>
            <span class="badge-payment ${badgeClass}">${paymentText}</span>
          </div>
          <div class="request-details">
            <div class="detail-item">
              <label>اسم الطفل</label>
              <strong>${data.child || '-'}</strong>
            </div>
            <div class="detail-item">
              <label>أيام الحضور</label>
              <strong>${data.days || '-'}</strong>
            </div>
            <div class="detail-item">
              <label>الطبيب المعالج</label>
              <strong>${data.doctorName || 'يُحدد لاحقاً'}</strong>
            </div>
            <div class="detail-item">
              <label>موعد الجلسة</label>
              <strong>${data.sessionTime || 'قريباً'}</strong>
            </div>
            <div class="detail-item" style="grid-column: span 2;">
              <label>حالة الحضور</label>
              <strong>${data.attendanceStatus || 'قيد الانتظار'}</strong>
            </div>
          </div>
        </div>
      `;
    } else {
      container.innerHTML = `
        <div class="glass-card" style="text-align:center; padding:30px;">
          <p style="font-size:16px; margin:0;">لا توجد طلبات مسجلة حالياً.</p>
        </div>
      `;
    }
  } catch (err) {
    console.error(err);
    container.innerHTML = `
      <div class="glass-card" style="text-align:center; padding:30px;">
        <p style="font-size:16px; margin:0; color:#ffdddd;">❌ حدث خطأ أثناء الاتصال بقاعدة البيانات.</p>
      </div>
    `;
  }
}

loadMyRequests();
</script>
</body>
</html>
