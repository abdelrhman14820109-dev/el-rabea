<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <!-- استدعاء مكتبات فايربيس (Firestore + Messaging) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-messaging-compat.js"></script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0879d5">
<title>مركز الربيع | تسجيل الدخول</title>
<style>
:root{--blue:#087ed8;--deep:#0755b4;--glass:rgba(145,220,255,.28);--line:rgba(255,255,255,.72)}
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100vh;height:100svh;font-family:Tahoma,Arial,sans-serif;color:#fff;overflow:hidden}
body{background:linear-gradient(145deg,rgba(0,111,220,.72),rgba(0,83,181,.78)),url('assets/login-background.jpg') center center/cover fixed no-repeat;display:flex;align-items:center;justify-content:center}
body:before,body:after{content:"";position:fixed;inset:-15%;pointer-events:none;z-index:-1}
body:before{background:repeating-linear-gradient(155deg,transparent 0 110px,rgba(255,255,255,.14) 112px,transparent 118px 190px);transform:rotate(-4deg)}
body:after{background:radial-gradient(ellipse at 20% 10%,rgba(255,255,255,.32),transparent 28%),radial-gradient(ellipse at 90% 55%,rgba(66,219,255,.26),transparent 35%);filter:blur(12px)}
.glow{position:fixed;height:2px;width:120vw;background:#8cf5ff;box-shadow:0 0 14px 4px #28dcff;transform:rotate(-27deg);left:-10vw;top:6%;opacity:.8;pointer-events:none}

.page{width:100%;max-width:480px;height:100%;max-height:100svh;margin:auto;padding:12px 14px;display:flex;flex-direction:column;justify-content:space-between;overflow-y:auto;position:relative}

.brand{text-align:center;margin:0 auto 4px;flex-shrink:0}
.brand h1{font-size:clamp(22px, 5vw, 28px);margin:0;font-weight:900;text-shadow:0 2px 4px #0753a6}
.brand p{margin:2px 0;font-weight:bold;font-size:13px;color:#e6faff;text-shadow:0 1px 3px #0755a0}

.panel{background:linear-gradient(145deg,rgba(145,224,255,.53),rgba(16,121,216,.46));border:1.5px solid rgba(255,255,255,.8);border-radius:26px;padding:12px 16px;box-shadow:inset 0 1px 8px rgba(255,255,255,.65),0 10px 25px rgba(0,42,120,.28);backdrop-filter:blur(12px);flex:1;display:flex;flex-direction:column;justify-content:center;margin:4px 0;overflow-y:auto}

.panel-head{display:flex;align-items:center;justify-content:flex-start;gap:10px;margin-bottom:8px}
.person-icon{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);flex-shrink:0}
.panel-head h2{font-size:20px;margin:0}.panel-head small{font-size:11px;color:#e9faff}

.field{height:46px;border-radius:28px;background:linear-gradient(105deg,rgba(230,249,255,.72),rgba(102,192,248,.55));border:1px solid rgba(255,255,255,.78);box-shadow:inset 0 2px 6px rgba(255,255,255,.35),0 3px 9px rgba(0,58,130,.12);display:flex;align-items:center;gap:10px;padding:4px 10px;margin:6px 0;color:#fff}
.field.auto-height{height:auto;min-height:46px;padding:8px 12px;border-radius:20px;display:block;}
.field .content{min-width:0;flex:1}
.field label{display:block;font-size:12px;font-weight:bold;margin-bottom:2px}
.field input,.field select{display:block;width:100%;border:0;outline:0;background:transparent;color:#fff;font:12px Tahoma,Arial;text-align:right;padding:0}
.field input::placeholder{color:rgba(255,255,255,.85)}
.field select option{color:#0755a8}

.split{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.split .field{margin:6px 0}

.submit{margin-top:8px;width:100%;height:46px;border-radius:26px;border:1px solid rgba(255,255,255,.9);background:linear-gradient(90deg,#04a4f3,#0873ec,#11a9f1);color:white;font-size:20px;font-weight:900;box-shadow:inset 0 1px 6px #a9f3ff,0 0 14px rgba(0,225,255,.45);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;flex-shrink:0}
.submit span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#29bff4;border:1px solid #b9f8ff;font-size:16px}

.footer{text-align:center;font-weight:bold;font-size:12px;margin:4px auto 0;color:#eafaff;flex-shrink:0}

#splash{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden;transition:opacity .45s ease,visibility .45s ease}
#splash img{display:block;width:100%;height:100%;object-fit:contain;max-width:100vw;max-height:100svh}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none}
</style>
</head>
<body>
<div id="splash" aria-label="أنيميشن مركز الربيع"><img src="alrabea-animation.gif" alt="أنيميشن مركز الربيع"></div>
<div class="glow"></div>
<main class="page">
<header class="brand">
<h1>مركز الربيع</h1>
<p>للعلاج الطبيعي وتأهيل الأطفال</p>
</header>
<section class="panel">
<div class="panel-head">
  <div class="person-icon">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="white"><circle cx="12" cy="7" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2z"/></svg>
  </div>
  <div><h2>تسجيل الدخول</h2><small>أدخل البيانات التالية للمتابعة</small></div>
</div>

<form id="loginForm">
<div class="field"><div class="content"><label for="parent">الاسم</label><input id="parent" required placeholder="أدخل اسمك بالكامل" autocomplete="name"></div></div>
<div class="field"><div class="content"><label for="phone">رقم الهاتف</label><input id="phone" required type="tel" inputmode="tel" placeholder="أدخل رقم هاتفك" autocomplete="tel"></div></div>
<div class="field"><div class="content"><label for="child">اسم الطفل</label><input id="child" required placeholder="أدخل اسم الطفل"></div></div>
<div class="split">
<div class="field"><div class="content"><label for="birth">تاريخ الميلاد</label><input id="birth" type="date" required aria-label="تاريخ الميلاد"></div></div>
<div class="field" style="display:grid;grid-template-columns:1fr auto;gap:4px;padding-right:8px;">
  <div class="content"><label for="ageNum">عمر الطفل</label><input id="ageNum" type="number" min="0" max="99" required placeholder="الرقم"></div>
  <div style="align-self:center;"><select id="ageUnit" style="background:transparent;color:#fff;border:0;outline:0;font-weight:bold;font-size:12px;"><option value="سنة">سنة</option><option value="أشهر">أشهر</option></select></div>
</div>
</div>

<div class="field">
  <div class="content">
    <label for="nationality">الجنسية</label>
    <select id="nationality" required>
      <option value="">اختر الجنسية</option>
      <option value="مصري">مصري</option>
      <option value="سوداني">سوداني</option>
      <option value="سوري">سوري</option>
      <option value="فلسطيني">فلسطيني</option>
      <option value="سعودي">سعودي</option>
      <option value="ليبي">ليبي</option>
      <option value="يمني">يمني</option>
      <option value="أخرى">جنسية أخرى</option>
    </select>
  </div>
</div>

<!-- اختيار أيام الحضور الفردية أو يومياً -->
<div class="field auto-height">
  <label style="font-size:12px; font-weight:bold; margin-bottom:6px; display:block;">أيام الحضور في المركز:</label>
  <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:6px; margin-bottom:6px;">
    <label style="display:flex; align-items:center; gap:4px; font-size:12px; cursor:pointer;"><input type="checkbox" name="day" value="السبت"> السبت</label>
    <label style="display:flex; align-items:center; gap:4px; font-size:12px; cursor:pointer;"><input type="checkbox" name="day" value="الأحد"> الأحد</label>
    <label style="display:flex; align-items:center; gap:4px; font-size:12px; cursor:pointer;"><input type="checkbox" name="day" value="الإثنين"> الإثنين</label>
    <label style="display:flex; align-items:center; gap:4px; font-size:12px; cursor:pointer;"><input type="checkbox" name="day" value="الثلاثاء"> الثلاثاء</label>
    <label style="display:flex; align-items:center; gap:4px; font-size:12px; cursor:pointer;"><input type="checkbox" name="day" value="الأربعاء"> الأربعاء</label>
    <label style="display:flex; align-items:center; gap:4px; font-size:12px; cursor:pointer;"><input type="checkbox" name="day" value="الخميس"> الخميس</label>
    <label style="display:flex; align-items:center; gap:4px; font-size:12px; cursor:pointer;"><input type="checkbox" name="day" value="الجمعة"> الجمعة</label>
  </div>
  <div style="border-top:1px solid rgba(255,255,255,0.3); padding-top:6px;">
    <label style="display:flex; align-items:center; gap:6px; font-size:13px; font-weight:bold; cursor:pointer; color:#e6faff;">
      <input type="checkbox" id="dailyCheck" value="يوميًا"> حضور يومي (كل الأسبوع)
    </label>
  </div>
</div>

<div class="field">
  <div class="content">
    <label for="type">نوع الجلسة العلاجية</label>
    <select id="type" required>
      <option value="">اختر نوع الجلسة</option>
      <option value="علاج طبيعي">علاج طبيعي</option>
      <option value="تحفيز كهربي">تحفيز كهربي</option>
      <option value="علاج وظيفي">علاج وظيفي</option>
      <option value="تحكم في البول والبراز">تحكم في البول والبراز</option>
      <option value="تخاطب">تخاطب</option>
      <option value="تنمية مهارات">تنمية مهارات</option>
      <option value="تكامل حسي">تكامل حسي</option>
    </select>
  </div>
</div>

<button class="submit" type="submit">دخول <span>➜</span></button>
<p id="msg" role="status" style="display:none;text-align:center;font-size:13px;margin-top:6px;font-weight:bold;color:#e6faff;"></p>
</form>
</section>
<footer class="footer">مركز الربيع للعلاج الطبيعي وتأهيل الأطفال</footer>
</main>

<script>
  // فحص ما إذا كان المستخدم مسجل مسبقاً
  if (localStorage.getItem('alrabeaPatient')) {
    window.location.href = 'index-home.html';
  }

  // إخفاء شاشة البداية (Splash)
  window.addEventListener('load', function(){
    setTimeout(function(){
      var splash = document.getElementById('splash');
      if(splash) splash.classList.add('hide');
    }, 2300);
  });

  // إعدادات Firebase
  const firebaseConfig = {
    apiKey: "AIzaSyCTPQTbz6h9oVMo1N4Y_3r_RAi1RCXSEhM",
    authDomain: "el-rabea.firebaseapp.com",
    projectId: "el-rabea",
    storageBucket: "el-rabea.firebasestorage.app",
    messagingSenderId: "527658441562",
    appId: "1:527658441562:web:ef9d9bd5461d87eeb63163",
    measurementId: "G-2592BQ0ZS7"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const messaging = firebase.messaging();

  // دالة طلب إذن الإشعارات وحفظ الرمز الخاص بالجهاز في قاعدة البيانات
  async function requestNotificationPermission(patientDocId) {
    try {
      const permission = await Notification.requestPermission();
      if (permission === 'granted') {
        const token = await messaging.getToken({ 
          vapidKey: 'BN6reyf4L258uP1PtjZBk6Du4J9p-OWFUmd0Xg3hQRXf5eAebUW4VOqkXFo106_OhIWfEoxXtLyzBIykj7BNPrY' 
        });
        
        if (token) {
          await db.collection("patients").doc(patientDocId).update({
            fcmToken: token
          });
          console.log("تم تفعيل وحفظ رمز الإشعارات بنجاح.");
        }
      } else {
        console.log('تم رفض إذن الإشعارات من قبل المستخدم.');
      }
    } catch (error) {
      console.error('خطأ أثناء طلب إذن الإشعارات:', error);
    }
  }

  // معالجة إرسال النموذج وحفظه في Firebase Firestore
  document.getElementById('loginForm').addEventListener('submit', async function(e){
    e.preventDefault();
    
    const submitBtn = document.querySelector('.submit');
    const msgEl = document.getElementById('msg');
    
    // تجميع العمر (الرقم + سنة أو أشهر)
    const ageValue = document.getElementById('ageNum').value + " " + document.getElementById('ageUnit').value;

    // تجميع الأيام المختارة
    let daysValue = "";
    const dailyChecked = document.getElementById('dailyCheck').checked;
    
    if (dailyChecked) {
      daysValue = "يوميًا (كل الأيام)";
    } else {
      const selectedDays = [];
      document.querySelectorAll('input[name="day"]:checked').forEach((cb) => {
        selectedDays.push(cb.value);
      });
      if (selectedDays.length === 0) {
        alert("الرجاء اختيار يوم واحد على الأقل للحضور أو تحديد حضور يومي.");
        return;
      }
      daysValue = selectedDays.join('، ');
    }

    const data = {
      name: document.getElementById('parent').value,
      phone: document.getElementById('phone').value,
      child: document.getElementById('child').value,
      birth: document.getElementById('birth').value,
      age: ageValue,
      nationality: document.getElementById('nationality').value,
      days: daysValue,
      type: document.getElementById('type').value,
      attendanceStatus: "قيد الانتظار",
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    };

    try {
      submitBtn.disabled = true;
      submitBtn.style.opacity = '0.7';
      msgEl.style.display = 'block';
      msgEl.textContent = '⏳ جاري الحفظ...';

      // حفظ البيانات في مجموعة "patients" على Firestore
      const docRef = await db.collection("patients").add(data);
      
      // طلب إذن الإشعارات وحفظ الرمز في المستند الجديد
      await requestNotificationPermission(docRef.id);
      
      // تخزين البيانات محلياً بشكل دائم
      localStorage.setItem('alrabeaPatient', JSON.stringify({ id: docRef.id, ...data }));
      
      msgEl.textContent = '✅ تم التسجيل بنجاح!';
      
      setTimeout(() => {
        window.location.href = 'index-home.html';
      }, 1000);

    } catch (error) {
      console.error("خطأ في حفظ البيانات:", error);
      msgEl.style.display = 'block';
      msgEl.textContent = '❌ حدث خطأ، حاول مرة أخرى.';
      submitBtn.disabled = false;
      submitBtn.style.opacity = '1';
    }
  });
</script>
</body>
</html>
