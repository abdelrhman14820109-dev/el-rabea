<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0879d5">
<title>مركز الربيع | طلباتي</title>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Tahoma,Arial,sans-serif;color:#fff}
body{
 min-height:100svh;
 background:radial-gradient(ellipse at 60% 22%,#55c6ff 0,transparent 38%),
 radial-gradient(ellipse at 0 85%,#0062c5 0,transparent 48%),
 linear-gradient(145deg,#08baff,#087ad8 43%,#0054b4 75%,#0a8ce6);
 overflow-x:hidden
}
body:before{content:"";position:fixed;inset:-15%;z-index:-1;pointer-events:none;background:repeating-linear-gradient(155deg,transparent 0 100px,rgba(255,255,255,.12) 102px,transparent 108px 180px);transform:rotate(-5deg)}
body:after{content:"";position:fixed;top:0;left:-20%;width:140%;height:2px;background:#6ff5ff;box-shadow:0 0 15px 5px #2bdfff;transform:rotate(-27deg);pointer-events:none}
.page{width:min(100%,680px);margin:auto;padding:25px 20px 24px}

.header{display:flex;align-items:center;gap:14px;margin:0 5px 24px}
.back{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;text-decoration:none;color:#fff;font-size:30px;background:rgba(255,255,255,.17);border:1px solid rgba(255,255,255,.5)}
.title{font-size:29px;font-weight:900}.subtitle{font-size:13px;color:#d3f4ff;margin-top:4px}

.glass{background:linear-gradient(135deg,rgba(135,219,255,.4),rgba(13,116,215,.4));border:1px solid rgba(255,255,255,.66);border-radius:31px;box-shadow:inset 0 1px 9px rgba(255,255,255,.32),0 12px 25px rgba(0,40,110,.16);backdrop-filter:blur(10px)}

.summary{padding:20px 16px;margin-bottom:16px}
.summaryTitle{font-size:21px;font-weight:900;margin-bottom:15px}
.moneyGrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.money{border-radius:19px;padding:16px 7px;text-align:center;background:linear-gradient(105deg,rgba(235,250,255,.75),rgba(143,215,255,.72));color:#0755a7}
.money .label{font-size:12px;margin-bottom:7px}.money strong{font-size:19px;display:block}
.remaining{margin-top:12px;padding:14px;border-radius:18px;background:rgba(255,255,255,.16);text-align:center}
.remaining strong{font-size:25px}

.section{font-size:22px;font-weight:900;margin:20px 4px 12px}
.payment{padding:16px 17px;margin-bottom:11px;display:flex;align-items:center;gap:13px}
.paymentIcon{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.5);font-size:23px;flex-shrink:0}
.paymentInfo{flex:1;min-width:0}.paymentInfo strong{display:block;font-size:17px;margin-bottom:5px}.paymentInfo small{color:#d4f4ff;font-size:12px}
.amount{font-size:18px;font-weight:900;white-space:nowrap}
.status{display:inline-block;margin-top:7px;padding:4px 9px;border-radius:20px;font-size:11px}
.paid{background:rgba(0,190,160,.32)}.unpaid{background:rgba(220,70,100,.32)}

.empty{text-align:center;padding:28px 15px;color:#d8f5ff;font-size:15px}
.loading{text-align:center;padding:30px;color:#d8f5ff}

.nav{position:sticky;bottom:10px;margin:27px -3px 0;border-radius:50px;min-height:88px;display:grid;grid-template-columns:repeat(4,1fr);align-items:center;padding:9px 5px;background:linear-gradient(120deg,rgba(159,224,255,.4),rgba(4,102,200,.46));border:1px solid rgba(255,255,255,.6);box-shadow:inset 0 1px 8px rgba(255,255,255,.35),0 8px 20px rgba(0,30,90,.2);backdrop-filter:blur(12px)}
.nav a{text-decoration:none;color:#bdeeff;font:13px Tahoma,Arial;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer}
.nav .ni{font-size:29px;line-height:1}.nav a.active{color:#fff;font-weight:bold}

.notice{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);width:min(90%,440px);padding:14px 18px;background:#0756a9;border:1px solid rgba(255,255,255,.7);border-radius:15px;text-align:center;box-shadow:0 8px 25px #003d87;display:none;z-index:10}
</style>
</head>

<body>
<main class="page">

<header class="header">
 <a href="index-home.html" class="back">‹</a>
 <div>
  <div class="title">طلباتي</div>
  <div class="subtitle">المدفوعات والمبالغ المستحقة للمركز</div>
 </div>
</header>

<section class="glass summary">
 <div class="summaryTitle">الحساب المالي</div>
 <div class="moneyGrid">
  <div class="money"><div class="label">إجمالي المطلوب</div><strong id="totalDue">0 ج.م</strong></div>
  <div class="money"><div class="label">إجمالي المدفوع</div><strong id="totalPaid">0 ج.م</strong></div>
  <div class="money"><div class="label">عدد العمليات</div><strong id="paymentCount">0</strong></div>
 </div>
 <div class="remaining">المتبقي عليك<br><strong id="remaining">0 ج.م</strong></div>
</section>

<div class="section">سجل المدفوعات</div>
<section id="paymentsList">
 <div class="glass loading">جاري تحميل بياناتك...</div>
</section>

<nav class="nav">
 <a href="settings.html"><span class="ni">⚙</span>الإعدادات</a>
 <a href="reports.html"><span class="ni">▤</span>التقارير</a>
 <a href="policies.html"><span class="ni">♧</span>السياسات</a>
 <a href="index-home.html"><span class="ni">⌂</span>الرئيسية</a>
</nav>

<div id="notice" class="notice"></div>
</main>

<script>
const firebaseConfig = {
 apiKey:"AIzaSyCTPQTbz6h9oVMo1N4Y_3r_RAi1RCXSEhM",
 authDomain:"el-rabea.firebaseapp.com",
 projectId:"el-rabea",
 storageBucket:"el-rabea.firebasestorage.app",
 messagingSenderId:"527658441562",
 appId:"1:527658441562:web:ef9d9bd5461d87eeb63163",
 measurementId:"G-2592BQ0ZS7"
};

firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

function money(value){
 return new Intl.NumberFormat('ar-EG').format(Number(value)||0)+' ج.م';
}

function notify(message){
 const n=document.getElementById('notice');
 n.textContent=message;
 n.style.display='block';
 setTimeout(()=>n.style.display='none',3000);
}

function escapeHtml(value){
 return String(value??'').replace(/[&<>"']/g,m=>({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
 }[m]));
}

function formatDate(value){
 if(!value) return 'بدون تاريخ';
 try{
  const d=value.toDate ? value.toDate() : new Date(value);
  if(isNaN(d)) return 'بدون تاريخ';
  return d.toLocaleDateString('ar-EG',{year:'numeric',month:'long',day:'numeric'});
 }catch(e){return 'بدون تاريخ'}
}

async function loadRequests(){
 const localData=JSON.parse(localStorage.getItem('alrabeaPatient')||'null');

 if(!localData || !localData.id){
  window.location.href='index.html';
  return;
 }

 try{
  const patientRef=db.collection('patients').doc(localData.id);
  const patientSnap=await patientRef.get();

  if(!patientSnap.exists){
   showEmpty('لم يتم العثور على بيانات الحساب.');
   return;
  }

  const patient=patientSnap.data();

  /*
   البيانات الأساسية يمكن وضعها مباشرة داخل patient:
   totalDue / totalPaid / remaining

   ويمكن أيضاً استخدام مجموعة payments للعمليات التفصيلية.
  */
  let totalDue=Number(patient.totalDue)||0;
  let totalPaid=Number(patient.totalPaid)||0;

  const paymentsSnap=await db.collection('payments')
   .where('patientId','==',localData.id)
   .get();

  const payments=[];
  paymentsSnap.forEach(doc=>{
   payments.push({id:doc.id,...doc.data()});
  });

  payments.sort((a,b)=>{
   const da=a.date?.toDate ? a.date.toDate() : new Date(a.date||0);
   const dbb=b.date?.toDate ? b.date.toDate() : new Date(b.date||0);
   return dbb-da;
  });

  // لو سجل المدفوعات موجود، نحسب المدفوع منه تلقائياً.
  if(payments.length){
   totalPaid=payments
    .filter(p=>String(p.status||'paid').toLowerCase()!=='unpaid')
    .reduce((sum,p)=>sum+(Number(p.amount)||0),0);

   // إجمالي المطلوب يمكن أن يأتي من patient.totalDue.
   // وإذا لم يوجد، نحسب المدفوع + العمليات غير المدفوعة.
   if(!patient.totalDue){
    totalDue=payments.reduce((sum,p)=>sum+(Number(p.amount)||0),0);
   }
  }

  const remaining=Math.max(0,totalDue-totalPaid);

  document.getElementById('totalDue').textContent=money(totalDue);
  document.getElementById('totalPaid').textContent=money(totalPaid);
  document.getElementById('remaining').textContent=money(remaining);
  document.getElementById('paymentCount').textContent=payments.length;

  renderPayments(payments);

 }catch(error){
  console.error(error);
  showEmpty('تعذر تحميل البيانات. تأكد من الاتصال بالإنترنت.');
 }
}

function renderPayments(payments){
 const box=document.getElementById('paymentsList');

 if(!payments.length){
  showEmpty('لا توجد عمليات مالية مسجلة حتى الآن.');
  return;
 }

 box.innerHTML=payments.map(p=>{
  const status=String(p.status||'paid').toLowerCase();
  const isUnpaid=status==='unpaid' || status==='غير مدفوع';
  const statusText=isUnpaid?'غير مدفوع':'مدفوع';

  return `
   <article class="glass payment">
    <div class="paymentIcon">${isUnpaid?'!':'✓'}</div>
    <div class="paymentInfo">
     <strong>${escapeHtml(p.description||'عملية مالية')}</strong>
     <small>${formatDate(p.date)}</small>
     <span class="status ${isUnpaid?'unpaid':'paid'}">${statusText}</span>
    </div>
    <div class="amount">${money(p.amount)}</div>
   </article>
  `;
 }).join('');
}

function showEmpty(message){
 document.getElementById('paymentsList').innerHTML=
  `<div class="glass empty">${escapeHtml(message)}</div>`;
}

loadRequests();
</script>
</body>
</html>
